# 方案评审模板

type: design_review
version: "0.2"

# 使用方式：
# 技术 Agent 出方案后提 PR，PR 描述按此模板写。
# 各方 Agent 读 PR 后，按自己角色的 review_lens 评审。
# 此模板同时包含"方案撰写"和"方案评审"两部分。
#
# ⚠️ 诚实声明(见 issue #3):business 与 tech 两个 lens 若由同一个底层模型驱动、
#   且没有注入各自真实的约束(成本/工期/KPI/预算),它们的"对立"是表演性的——
#   这时本模板只是一份【结构化自检清单】,不是【真·多方制衡】,别拿它的"过审"当多方背书。
#   要让评审有牙齿:要么给两侧注入真实差异化约束,要么至少跑下面的 red_team lens
#   (它的目标函数是"找方案为什么会崩",和趋同激励相反)。

# ─── 方案撰写（技术 Agent 写）───────────────────────────

design_sections:
  summary:
    label: "方案概述"
    required: true
    note: "用自然语言写，目标是让业务 Agent 也能看懂大致思路"

  approach:
    label: "技术方案"
    required: true
    note: "架构、关键实现路径、涉及哪些模块"

  tradeoffs:
    label: "取舍说明"
    required: true
    note: "为什么选这条路而不是别的？放弃了什么？"

  risk:
    label: "风险点"
    required: false
    note: "已知的不确定因素、可能的副作用"

  estimate:
    label: "预估工作量"
    required: true
    note: "给时间量级（几小时/几天/几周），不用精确"

# ─── 方案评审（各方 Agent 读 PR 后按角色选 section）────

review_lenses:
  business:
    label: "业务视角"
    questions:
      - "这个方案解决了最初提的问题吗？"
      - "方案描述的业务流程我能看懂吗？哪里需要解释？"
      - "时间安排是否可接受？"
      - "有没有隐含的体验变化需要知道的？"
      - "如果做了取舍，取舍的是什么？影响谁？"

  tech:
    label: "技术视角"
    questions:
      - "架构合理吗？有没有过度设计或设计不足？"
      - "有没有性能/安全/兼容性的坑？"
      - "是否引入了不必要的依赖或复杂度？"
      - "有没有更简单的方法达到同样效果？"
      - "测试策略够不够？"

  red_team:
    label: "红队视角(对抗性,目标=找它为什么会崩)"
    note: >
      不替任何角色说话,唯一 KPI 是证伪这个方案。默认假设方案有问题,去找它。
      存在的意义:抵消同一个底层模型驱动的 agent 之间的趋同/和稀泥倾向(见 issue #3)。
    questions:
      - "这个方案最可能在哪一步失败？给出具体的失败场景。"
      - "它悄悄假设了什么前提？哪个前提一旦不成立就崩？"
      - "summary 写得漂亮,但回避了哪个硬问题？"
      - "有没有'看起来多方评审过、其实没人真反对'的虚假共识？"
      - "如果必须否决它,最强的理由是什么？"

guidance: |
  1. 技术 Agent：写方案时把 summary 写清楚——这是给业务 Agent 看的门面。
  2. 所有 Agent：评审时只用自己的 review_lens，不要越界。
  3. 评审意见写在 PR comment 里，每条意见对应一个具体的 lens question。
  4. ⭐ 至少跑一遍 red_team lens;它发现的真问题,优先级高于 business/tech 的"通过"。
  5. ⭐ 评审结论是给人"审对照"的材料,不是 agent 替人拍板。分歧如实暴露给人(标记 @ 人类),不要互相说服到趋同。
