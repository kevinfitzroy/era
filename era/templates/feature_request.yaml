# 提需求模板

type: feature_request
version: "0.3"

# 使用方式：
# Agent 把下面字段变成自然语言提问，引导人逐步描述。
# 产出的 YAML 写入 Issue 正文。
#
# ⭐ provenance(amplifier 铁律,见 discussions/2026-06-04-amplifier-not-proxy.md):
#   每个由人提供的字段,值都要带一个 source 标注——
#     stated      = 人明确说过的(原话或贴近原话)
#     inferred    = agent 推断/补充的(人没说,你替他补的)
#     unconfirmed = 还没跟人确认的
#   写法:在该字段下加 `source: stated|inferred|unconfirmed`。
#   inferred 的内容,回放时必须显式告诉人"这条是我替你补的"——你是 amplifier,不是替人造信息的 proxy。

fields:
  title:
    label: "一句话描述"
    required: true
    example: "月度汇总报表查询加速"

  problem:
    label: "目前的痛点"
    required: true
    prompt: "现在哪里不方便？具体什么场景下难受？"
    example: "用户打开月度汇总报表时等待超过 10 秒，财务团队每月初集中查报表体验很差"

  expectation:
    label: "期望的理想状态"
    required: true
    prompt: "如果这个问题解决了，你期望是什么样的？"
    example: "查询结果在 3 秒内返回"

  context:
    label: "相关背景"
    required: false
    prompt: "有没有特定的场景、时间、范围？"
    example: "涉及营收汇总和部门费用明细两张表，使用高峰是每月 1-5 号"

  impact:
    label: "影响范围"
    required: false
    prompt: "影响多少人？影响程度怎么样？"
    example: "财务团队 10 人，每月初集中使用，有人为此加班"

  unknowns:
    label: "还没确认的信息"
    required: false
    note: "Agent 自动识别对话中的信息缺口，列在这里"

  representability:
    label: "代言可信度(amplifier 弃权出口)"
    required: true
    options:
      - "high（人说得清，我有把握忠实代言）"
      - "partial（部分吃不准，已在 unknowns 标出）"
      - "low（我代表不了，建议人直接参与/直连对方）"
    note: >
      agent 自评:我这次转述+补齐,有多大把握忠实代表了人的本意?
      为 low 时不要硬凑一个完整 YAML——如实说"这个我吃不准",把人拉进来,或建议两个人直接谈。
      proxy 必须替你发声;amplifier 允许弃权。

  signoff:
    label: "差异驱动确认记录(sign-off)"
    required: false
    note: >
      记录 sign-off 逐条拍的结果:confirmed / corrected(连人改成了什么) / unconfirmed。
      纯 stated 无歧义的不必逐条记;被改写或补充的字段附人的原话片段(human_said)作对照基准。
    example:
      - field: expectation
        verdict: corrected
        source: inferred
        agent_had: "3 秒内返回（我替你定的指标）"
        human_said: "5 秒就行"
      - field: problem
        verdict: confirmed
        source: stated

# Agent 使用指南
guidance: |
  1. 不要直接把这个 YAML 丢给人看——把字段变成你的话术。
  2. 先问 problem，再问 expectation，最后补 context 和 impact。
  3. 对话中发现了信息缺口，填到 unknowns，不用再追问（除非关键）。
  4. ⭐ 每个字段标 source(stated/inferred/unconfirmed)。
  5. ⭐ sign-off 用**差异驱动审对照**(见 protocol「审对照确认」):只逐条让人拍 inferred / unconfirmed / 被你改写语义的点;纯 stated 无歧义的默认采纳,允许人一句话调出全文对照。别念整段回放求点头。
  6. ⭐ 被改写/补充的字段在 issue 附人的**原话片段**作对照基准(纯 stated 不必附);填 representability,为 low 时如实弃权;把逐条确认结果记进 signoff。
  7. 人逐条确认后写 GitHub Issue。你产出的是给人审"对照"的材料,不是替人拍板的结论。
