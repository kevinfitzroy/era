# 报 Bug 模板

type: bug_report
version: "0.3"

# ⭐ provenance(amplifier 铁律):每个由人提供的字段,值都带 source 标注——
#   stated / inferred / unconfirmed(见 feature_request.yaml 与
#   discussions/2026-06-04-amplifier-not-proxy.md)。inferred 的内容回放时必须显式说"这条是我替你补的"。

fields:
  title:
    label: "一句话描述"
    required: true
    example: "月度汇总报表查询超时"

  symptom:
    label: "看到了什么现象"
    required: true
    prompt: "你看到了什么？哪里不对？"
    example: "打开报表后页面一直转圈，最终显示加载失败"

  expected:
    label: "本来应该怎样"
    required: true
    prompt: "正常情况应该是什么样的？"
    example: "3 秒内显示报表数据"

  steps_to_reproduce:
    label: "怎么触发"
    required: true
    prompt: "一步一步告诉我你是怎么操作的？"
    example:
      - "进入财务模块"
      - "点击月度汇总报表"
      - "等待后报错"

  environment:
    label: "使用环境"
    required: false
    prompt: "用的什么浏览器/设备？在什么网络环境下？"
    example: "Chrome 浏览器，公司内网"

  severity:
    label: "严重程度"
    required: true
    options: ["critical（系统瘫痪）","high（核心功能受阻）","medium（有影响但有绕过方式）","low（小问题）"]
    note: "Agent 根据人的描述初步判断，标注在 Issue 标签上"

  affected:
    label: "影响范围"
    required: false
    prompt: "只有你遇到还是都遇到了？"
    example: "财务团队全员"

  unknowns:
    label: "还没确认的信息"
    required: false

  representability:
    label: "代言可信度(amplifier 弃权出口)"
    required: true
    options:
      - "high（现象清楚，我有把握忠实转述）"
      - "partial（部分吃不准，已在 unknowns 标出）"
      - "low（我复述不准，建议人直接参与）"
    note: >
      agent 自评:我对现象/复现的转述有多大把握忠实?
      为 low 时不要硬凑——如实说吃不准,把人拉进来。

  signoff:
    label: "差异驱动确认记录(sign-off)"
    required: false           # 但 severity=high/critical 时必填,见 note
    note: >
      记录 sign-off 逐条拍的结果:confirmed / corrected / unconfirmed。纯 stated 无歧义不必记;
      被改写/补充的字段(尤其 symptom、steps_to_reproduce、severity)附人原话(human_said)作对照基准。
      ⚠️ severity=high/critical 时**必填**:技术 agent 不该基于未经人确认的高危描述开工。

guidance: |
  1. 报 Bug 和提需求的最大区别：Bug 追问复现步骤和环境，需求追问痛点和期望。
  2. severity 你初步判断，技术 Agent 收到后会再评估。
  3. 如果人提供的信息不足以复现，标出来，技术 Agent 会追问。
  4. ⭐ 每个字段标 source(stated/inferred/unconfirmed);填 representability,为 low 时如实弃权,别编复现步骤。
  5. ⭐ sign-off 用差异驱动审对照(见 protocol「审对照确认」):只逐条让人拍 inferred/unconfirmed/被你改写的点(尤其 severity、复现步骤),别念整段回放求点头;被改写/补充的附原话作对照,结果记进 signoff。
  6. ⭐ severity=high/critical 的 bug,sign-off **必做**——未经人确认的高危描述,技术 agent 不开工。
